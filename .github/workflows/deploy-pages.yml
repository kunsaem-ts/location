# PWA를 GitHub Pages에 배포한다 (TASKS.md 8-4).
# 필요 설정: 리포지토리 Secret MAPS_API_KEY (Maps JavaScript API 키), Pages 소스 = GitHub Actions
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2 # CLAUDE.md 4절과 맞춘다
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # 키는 소스에 없고 Secret에서만 주입한다 (NFR-02)
      - run: >
          flutter build web --release
          --base-href /location/
          --dart-define=MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
